  <text x="330" y="184" class="t">135</text><text x="330" y="206" class="s">PSU 2023</text>
  <text x="606" y="184" class="t">228</text><text x="606" y="206" class="s">PSU 2024 + delta</text>
  <text x="882" y="184" class="t">153</text><text x="882" y="206" class="s">PSU 2025 + delta</text>

  <rect x="40" y="260" width="700" height="350" class="zone"/>
  <text x="52" y="280" class="xs">TENGAH KIRI: VISUAL UTAMA</text>
  <text x="52" y="304" class="t">CHOROPLETH POLYGON KELURAHAN · luminance biru = PSU</text>
  <text x="52" y="326" class="s">hover: tooltip wilayah/kecamatan/kelurahan/PSU · zoom Leaflet · polygon no-data abu putus-putus</text>
