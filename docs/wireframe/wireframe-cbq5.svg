<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-label="Wireframe low-fidelity CBQ 5: choropleth, legenda, bar PSU, dan heatmap">
  <rect width="1200" height="1000" fill="#ffffff"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #4a4a4a; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 13px; }
    .xs { font-size: 12px; fill: #666; }
    .box { fill: #f4f4f4; stroke: #9a9a9a; stroke-width: 1; }
    .zone { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .tab { fill: #ececec; stroke: #aaa; }
    .active { fill: #e2e2e2; stroke: #777; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="1200" height="64" fill="#fafafa" stroke="#bbb"/>
  <text x="40" y="28" class="t">Peningkatan Kawasan dan Fasilitas Permukiman DKI Jakarta 2023–2025</text>
  <text x="40" y="48" class="xs">wireframe low-fidelity · CBQ 5 · choropleth batas kelurahan</text>
  <g class="tab">
    <rect x="740" y="20" width="72" height="28"/><rect x="820" y="20" width="62" height="28"/><rect x="890" y="20" width="62" height="28"/><rect x="960" y="20" width="62" height="28"/><rect x="1030" y="20" width="62" height="28"/><rect x="1100" y="20" width="62" height="28" class="active"/>
  </g>
  <text x="750" y="39" class="s">Overview</text><text x="830" y="39" class="s">CBQ 1</text><text x="900" y="39" class="s">CBQ 2</text><text x="970" y="39" class="s">CBQ 3</text><text x="1040" y="39" class="s">CBQ 4</text><text x="1110" y="39" class="s">CBQ 5</text>

  <text x="40" y="92" class="s">Pertanyaan: Bagaimana persebaran jumlah peningkatan PSU pada setiap wilayah?</text>
  <text x="40" y="114" class="t">JUDUL JAWABAN (dihitung otomatis dari data + filter)</text>
  <text x="930" y="92" class="s">Filter: Tahun [Semua ▾]</text>

  <text x="40" y="140" class="xs">ATAS: SCORECARD</text>
  <g class="box">
    <rect x="40" y="150" width="266" height="80"/><rect x="316" y="150" width="266" height="80"/><rect x="592" y="150" width="266" height="80"/><rect x="868" y="150" width="292" height="80"/>
