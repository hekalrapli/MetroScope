  <text x="772" y="280" class="xs">TENGAH KANAN: LEGENDA</text>
  <text x="772" y="304" class="t">Legenda peta</text>
  <text x="772" y="330" class="s">[ Jakarta ] [ Semua DKI ] [ Label wilayah ]</text>
