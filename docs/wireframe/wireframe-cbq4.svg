  <rect x="95" y="555" width="10" height="10" transform="rotate(45 100 560)" fill="#fff" stroke="#666" stroke-width="2"/><rect x="415" y="515" width="10" height="10" transform="rotate(45 420 520)" fill="#fff" stroke="#666" stroke-width="2"/><rect x="755" y="495" width="10" height="10" transform="rotate(45 760 500)" fill="#fff" stroke="#666" stroke-width="2"/><rect x="1035" y="445" width="10" height="10" transform="rotate(45 1040 450)" fill="#fff" stroke="#666" stroke-width="2"/>
