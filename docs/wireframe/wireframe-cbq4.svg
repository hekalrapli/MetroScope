  <text x="40" y="130" class="xs">ATAS: SCORECARD</text>
  <rect x="40" y="140" width="268" height="86" class="box"/>
  <text x="54" y="176" class="t">ANGKA 24px</text>
  <text x="54" y="198" class="s">label KPI · delta</text>
  <text x="54" y="216" class="xs">kelurahan 2025 + delta</text>
  <rect x="324" y="140" width="268" height="86" class="box"/>
  <text x="338" y="176" class="t">ANGKA 24px</text>
  <text x="338" y="198" class="s">label KPI · delta</text>
  <text x="338" y="216" class="xs">kelurahan 2024</text>
  <rect x="608" y="140" width="268" height="86" class="box"/>
  <text x="622" y="176" class="t">ANGKA 24px</text>
  <text x="622" y="198" class="s">label KPI · delta</text>
  <text x="622" y="216" class="xs">RW unik kumulatif</text>
  <rect x="892" y="140" width="268" height="86" class="box"/>
