  <text x="906" y="198" class="s">label KPI · delta</text>
  <text x="906" y="216" class="xs">RW berulang</text>
  <rect x="40" y="250" width="1120" height="350" class="zone"/>
  <text x="52" y="270" class="xs">TENGAH: VISUAL UTAMA</text>
  <text x="52" y="294" class="t">LINE CHART DUA SERI — kelurahan unik per tahun &amp; RW baru per tahun</text>
  <text x="52" y="316" class="s">dua hue berbeda · marker berbeda (lingkaran vs belah ketupat) · label langsung</text>
  <text x="900" y="294" class="s">Filter: Wilayah [Semua ▾]</text>
  <path d="M100 540 L420 500 L760 440 L1040 390" fill="none" stroke="#888" stroke-width="2"/>
  <path d="M100 560 L420 520 L760 500 L1040 450" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="6 4"/>
