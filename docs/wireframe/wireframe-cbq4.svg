    <rect x="300" y="780" width="90" height="80" fill="#e9e9e9"/><rect x="300" y="720" width="90" height="60" fill="#f5f5f5"/>
    <rect x="470" y="790" width="90" height="90" fill="#e9e9e9"/><rect x="470" y="720" width="90" height="70" fill="#f5f5f5"/>
